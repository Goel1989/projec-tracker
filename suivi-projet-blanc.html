<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Suivi de projet</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet"><style id="css">
/* Plan : outil de pilotage sobre. Bandeau de santé en tête, puis chantiers, puis détail. Neutres ardoise, accent bleu pétrole, couleurs de voyant séparées de l'accent. */
:root{
  --fond:#f3f5f7; --carte:#ffffff; --trait:#d9dfe5; --texte:#18222c; --doux:#5b6875;
  --accent:#0f5e78; --accent-doux:#e2eff3; --sur-accent:#ffffff;
  --vert:#1c7c4a; --vert-fond:#e1f3e8; --orange:#a65f00; --orange-fond:#fdefd3; --rouge:#b3261e; --rouge-fond:#fbe3e1; --neutre:#55616d; --neutre-fond:#e8ecf0; --bleu:#2b5fa8; --bleu-fond:#e3ecf8;
  --titre:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; --corps:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --fond:#11171d; --carte:#1a222b; --trait:#2f3a45; --texte:#e6ebf0; --doux:#9aa7b4;
  --accent:#6cc3de; --accent-doux:#17323c; --sur-accent:#0c1a20;
  --vert:#6fd39a; --vert-fond:#173524; --orange:#f0b65a; --orange-fond:#3b2c10; --rouge:#ff8f86; --rouge-fond:#41201d; --neutre:#a7b3bf; --neutre-fond:#27313b; --bleu:#8fb8f2; --bleu-fond:#1c2c44;}}
:root[data-theme="dark"]{color-scheme:dark;
  --fond:#11171d; --carte:#1a222b; --trait:#2f3a45; --texte:#e6ebf0; --doux:#9aa7b4;
  --accent:#6cc3de; --accent-doux:#17323c; --sur-accent:#0c1a20;
  --vert:#6fd39a; --vert-fond:#173524; --orange:#f0b65a; --orange-fond:#3b2c10; --rouge:#ff8f86; --rouge-fond:#41201d; --neutre:#a7b3bf; --neutre-fond:#27313b; --bleu:#8fb8f2; --bleu-fond:#1c2c44;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fond);color:var(--texte);font:15px/1.45 var(--corps);font-variant-numeric:tabular-nums}
#app{max-width:1840px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--titre);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:19px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--trait);background:var(--carte);border-radius:6px;padding:7px 12px}
button:hover{border-color:var(--accent)}
button.fort{background:var(--accent);color:var(--sur-accent);border-color:var(--accent);font-weight:600}
button.danger{color:var(--rouge)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--carte);border:1px solid var(--trait);border-radius:6px;padding:6px 8px;max-width:100%}
.entete{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.entete .nom{font:600 26px var(--titre);border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-6px;min-width:0;width:min(100%,520px)}
.entete .nom:hover,.entete .nom:focus{border-color:var(--trait);background:var(--carte)}
.sauve{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.petit{font-size:13px;color:var(--doux)}
.onglets{display:flex;gap:4px;border-bottom:1px solid var(--trait)}
.onglets a{padding:9px 14px;text-decoration:none;color:var(--doux);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.onglets a.actif{color:var(--accent);border-color:var(--accent)}
.bandeau{border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.bandeau.info{background:var(--accent-doux)} .bandeau.alerte{background:var(--orange-fond)} .bandeau.erreur{background:var(--rouge-fond)}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:10px;padding:16px}
.sante{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;border-left:8px solid var(--neutre)}
.sante.vert{border-left-color:var(--vert)} .sante.orange{border-left-color:var(--orange)} .sante.rouge{border-left-color:var(--rouge)}
.sante .verdict{font:600 30px/1.15 var(--titre)}
.sante.vert .verdict{color:var(--vert)} .sante.orange .verdict{color:var(--orange)} .sante.rouge .verdict{color:var(--rouge)}
.compteurs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pastille{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.pastille::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.p-vert{background:var(--vert-fond);color:var(--vert)} .p-orange{background:var(--orange-fond);color:var(--orange)} .p-rouge{background:var(--rouge-fond);color:var(--rouge)}
.p-fini{background:var(--bleu-fond);color:var(--bleu)} .p-neutre{background:var(--neutre-fond);color:var(--neutre)}
.jauge{height:8px;background:var(--neutre-fond);border-radius:4px;overflow:hidden;min-width:70px}
.jauge i{display:block;height:100%;background:var(--accent);border-radius:4px}
.grand{font:600 34px var(--titre)}
.deux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.liste{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.liste li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--trait)}
.liste li button{padding:3px 8px;font-size:13px}
.liste .quoi{overflow-wrap:anywhere}
.defile{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--doux);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--trait);vertical-align:top}
td.action{min-width:180px;width:22%;overflow-wrap:anywhere}
td.num,th.num{text-align:right}
tr.fini td.action{color:var(--doux)}
.avance{display:flex;gap:8px;align-items:center}
.avance input{width:68px;text-align:right}
.barre{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.barre .pousse{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.suivi{border-top:1px solid var(--trait);padding:10px 0;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px;align-items:start}
.suivi textarea{min-height:54px;width:100%}
.suivi input{width:100%}
.dernier{display:block;margin-top:3px;white-space:pre-line}
.rapport{width:100%;min-height:340px;font:14px/1.5 var(--corps)}
@media (max-width:560px){.suivi{grid-template-columns:minmax(0,1fr)}}
td.suivis{min-width:260px;width:38%;vertical-align:top}
.jl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px}
.jl span{white-space:pre-line;overflow-wrap:anywhere}
.jl strong{font-weight:600;white-space:nowrap}
.page-gantt{display:flex;flex-direction:column;gap:8px}
.cadre-page{border:1px solid var(--trait);border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cadre-page svg{display:block;width:100%;height:auto}
.gantt-boite{overflow-x:auto;border:1px solid var(--trait);border-radius:8px;background:var(--carte);margin-top:12px}
.gantt-boite svg{display:block}
.gantt-boite svg text{font:12px var(--corps);fill:var(--texte)}
.gantt-boite svg text.doux{fill:var(--doux);font-size:11px}
.gantt-boite svg text.chantier{font:600 13px var(--titre);fill:var(--texte)}
.legende{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px;font-size:13px;color:var(--doux)}
.legende i{display:inline-block;width:10px;height:10px;transform:rotate(45deg);margin-right:6px;vertical-align:middle}
.groupe-chantier{margin-top:0}
.groupe-chantier h3{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dossier-copies{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px;cursor:pointer}
.raye{text-decoration:line-through;color:var(--doux)}
dialog{border:1px solid var(--trait);border-radius:12px;background:var(--carte);color:var(--texte);padding:20px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(10,15,20,.55)}
.champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}
.champs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--doux)}
.champs label.large{grid-column:1/-1}
.champs input,.champs select,.champs textarea{color:var(--texte);width:100%}
.champs label.coche{flex-direction:row;align-items:center;gap:8px;color:var(--texte);font-size:15px}
.champs label.coche input{width:auto}
textarea{min-height:80px;resize:vertical}
.pied{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.pied div{display:flex;gap:8px}
svg text{fill:var(--doux);font:11px var(--corps)}
@media (max-width:760px){.sante,.deux,.champs{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.jauge i{transition:width .3s}}

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function auj(){return iso(new Date());}
function jours(a,b){var x=a.split("-"),y=b.split("-");return Math.round((Date.UTC(+y[0],y[1]-1,+y[2])-Date.UTC(+x[0],x[1]-1,+x[2]))/864e5);}

function lireDate(s){
  s=String(s==null?"":s).trim(); if(!s)return "";
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);

/* ---------- journal de suivi : un commentaire daté par case ---------- */
function decouper(txt){
  var notes=[],jl=[],cur=null;
  String(txt||"").split(/\r?\n/).forEach(function(ligne){
    var m=ligne.match(/^\s*(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\s*[:;\/\-–]?\s*(.*)$/);

  });

/* ---------- voyant : avancement réel comparé à l'avancement attendu ---------- */
function echeance(t){return t.reprog||t.delai||"";}
function attendu(t,j){
  var e=echeance(t); if(!e||!t.debut)return null;
  var total=jours(t.debut,e); if(total<=0)return j>=e?100:0;
  return Math.max(0,Math.min(100,Math.round(jours(t.debut,j)/total*100)));

function voyant(t,j){
  j=j||auj();

}
function bilan(liste){

function evolution(b){

  var x=function(i){return g+i*(W-g-dr)/(pts.length-1);}, y=function(v){return ht+(100-v)*(H-ht-bs)/100;};
  var ligne=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.moy).toFixed(1);}).join(" ");
  var s='<p class="petit">'+(d>0?"+"+d:d)+' point'+(Math.abs(d)>1?"s":"")+' depuis la semaine précédente</p>';

  [0,50,100].forEach(function(v){s+='<line x1="'+g+'" x2="'+(W-dr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--trait)"/><text x="'+(g-5)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';});
  s+='<path d="'+ligne+' L'+x(pts.length-1)+' '+y(0)+' L'+x(0)+' '+y(0)+' Z" fill="var(--accent-doux)"/><path d="'+ligne+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  s+='<circle cx="'+x(pts.length-1)+'" cy="'+y(pts[pts.length-1].moy)+'" r="4" fill="var(--accent)"/>';
  s+='<text x="'+x(0)+'" y="'+(H-3)+'">'+h(pts[0].w.slice(5))+'</text><text x="'+x(pts.length-1)+'" y="'+(H-3)+'" text-anchor="end">'+h(pts[pts.length-1].w.slice(5))+'</text></svg>';

}
function listeFiltree(){

  var y=Y_AXE;
  page.forEach(function(g){

  return F;
}

/* ---------- import / export ---------- */
function lignes(texte){
  var R=[],r=[],c="",q=false,i,ch,sep="\t";
  texte=String(texte).replace(/^\uFEFF/,"");
  var l1=texte.split("\n")[0].replace(/"[^"]*"?/g,""), nb=function(x){return l1.split(x).length-1;};
  if(!nb("\t")){sep=nb(";")>=nb(",")?";":",";}
  for(i=0;i<texte.length;i++){ch=texte[i];
    if(q){if(ch==='"'){if(texte[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"'&&c==="")q=true;
    else if(ch===sep){r.push(c);c="";}
    else if(ch==="\n"){r.push(c);R.push(r);r=[];c="";}
    else if(ch!=="\r")c+=ch;}
  if(c!==""||r.length){r.push(c);R.push(r);}
  return R.filter(function(x){return x.some(function(y){return y.trim()!=="";});});
}

  var tete=R[0].map(function(x){return noms[norme(x)]||"";}), cols;

  var j=auj();

    var o={};cols.forEach(function(c,i){if(c)o[c]=(r[i]||"").trim();});

  }).filter(function(t){return t.action||t.chantier;});
}
